name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). The three repo-infra release pieces it calls build the
# archives, the deb and rpm packages from the musl archives, and the bottle
# with the rewritten Formula/edaptor.rb (D32). Read-only: nothing here writes
# the repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Every archive carries examples/: the formula installs it to pkgshare and
  # the packages ship examples/config.toml as documentation.
  binaries:
    uses: oposs/repo-infra/.github/workflows/ri-release-rust-binaries.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: edaptor
      extra_paths: examples

  packages:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-nfpm.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      config: nfpm.yaml
      packagers: '{"deb": {}, "rpm": {}}'
      archives: x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  homebrew:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-homebrew.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: edaptor
