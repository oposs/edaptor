name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). edaptor's own build, release-build-local.yml, makes the
# binaries, the packages and the Homebrew formula.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-build-local:
    uses: ./.github/workflows/release-build-local.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
