# edaptor demo config — points at the rich podman test server started by
# `scripts/test-ldap.sh start`. Bind password is `adminpassword`, exposed via
# the EDAPTOR_TEST_ADMIN_PW env var the script tells you to export.

[server]
uri          = "ldap://localhost:1389"
base_dn      = "dc=example,dc=org"
start_tls    = false
timeout_secs = 10

[auth]
method          = "simple"
bind_dn         = "cn=admin,dc=example,dc=org"
password_source = "env:EDAPTOR_TEST_ADMIN_PW"

# Samba domain SID fallback; edaptor also discovers it from the
# sambaDomainName=EXAMPLE entry in the directory.
[samba]
domain_sid           = "S-1-5-21-1234567890-987654321-1122334455"
algorithmic_rid_base = 1000

[[profile]]
name           = "user"
object_classes = ["inetOrgPerson", "posixAccount", "shadowAccount", "sambaSamAccount"]
rdn_attr       = "uid"
search_base    = "ou=people,dc=example,dc=org"
show           = ["uid", "cn", "sn", "givenName", "mail", "ou", "uidNumber", "gidNumber", "homeDirectory"]
search_attrs   = ["cn", "uid", "mail"]
label          = "{cn} ({uid})"

[profile.defaults]
loginShell    = "/bin/bash"
homeDirectory = "/home/{uid}"
uidNumber     = "{next:10000-60000}"

[profile.widget.userPassword]
kind  = "password"
samba = true

[profile.widget.sambaAcctFlags]
kind   = "choice"
select = "multi"
format = "bracketed"
options = [
  { value = "D", label = "Disabled" },
  { value = "X", label = "Password never expires" },
  { value = "N", label = "No password required" },
]

[profile.widget.loginShell]
kind   = "choice"
select = "single"
format = "plain"
options = [
  { value = "/bin/bash",     label = "Bash" },
  { value = "/bin/sh",       label = "POSIX sh" },
  { value = "/sbin/nologin", label = "No login" },
]

# gidNumber: shown in the form as "<number> (<group name>)" and edited via an
# editable-combobox popup — type a number freely or filter the posixgroup list
# and pick one.
[profile.widget.gidNumber]
kind      = "lookup"
candidate = "posixgroup"
store     = "gidNumber"
label     = "{cn}"

# memberOf is a synthetic back-ref: ticking a group writes `member` on it
# (the memberOf attribute itself is overlay-maintained, never written directly).
[profile.widget.memberOf]
kind      = "membership"
candidate = "group"
via       = "member"

[[profile]]
name           = "group"
object_classes = ["groupOfNames"]
rdn_attr       = "cn"
search_base    = "ou=groups,dc=example,dc=org"
show           = ["cn", "description"]
label          = "{cn}"

# member is a multi-select DN picker over users.
[profile.widget.member]
kind      = "picker"
candidate = "user"

# DEMO ONLY: treat the group's multi-valued `description` as an X-ORDERED
# editable list so the ordered editor is drivable against the demo server.
# Note: saving writes `{n}`-prefixed values; edaptor strips them on read, so
# round-trips stay self-consistent (other tools will see the `{n}` tags).
[profile.widget.description]
kind = "x_ordered"

[[profile]]
name           = "posixgroup"
object_classes = ["posixGroup"]
rdn_attr       = "cn"
search_base    = "ou=groups,dc=example,dc=org"
show           = ["cn", "gidNumber", "memberUid", "description"]
label          = "{cn}"

# memberUid stores each picked user's `uid` (a multi-select user picker).
[profile.widget.memberUid]
kind      = "picker"
candidate = "user"
store     = "uid"
