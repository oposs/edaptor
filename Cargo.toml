[package]
name = "edaptor"
version = "0.1.0"
edition = "2021"
description = "TUI for editing OpenLDAP directories (users, groups, memberships)"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
ldap3 = "0.12"            # default features: sync + tls (native-tls)
md4 = "0.11"             # NT hash (sambaNTPassword = MD4(UTF-16LE(password)))
native-tls = "0.2"       # build a custom TlsConnector for a configured CA
rpassword = "7"          # read the bind password without echo
ldap-types = { version = "0.7", default-features = false, features = ["chumsky"] }
chumsky = "0.12"
oid = "0.3"
turbo-vision = "1.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "edaptor"
path = "src/main.rs"

[lib]
name = "edaptor"
path = "src/lib.rs"
