[package]
name = "edaptor"
version = "1.8.0"
edition = "2021"
default-run = "edaptor"
description = "TUI for editing OpenLDAP directories (users, groups, memberships)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
md4 = "0.11"             # NT hash (sambaNTPassword = MD4(UTF-16LE(password)))
# default-features = false is REQUIRED: drops rustls's default aws-lc-rs provider,
# leaving only ldap3's `ring`. Two providers would panic ClientConfig::builder().
rustls = { version = "0.23", default-features = false }  # custom ClientConfig for a configured CA
rustls-pemfile = "2"     # parse PEM CA certificates into CertificateDer
rpassword = "7"          # read the bind password without echo
ldap-types = { version = "0.7", default-features = false, features = ["chumsky"] }
chumsky = "0.12"
oid = "0.3"
unicode-width = "0.2"
# Formats the entry form's operational timestamps in local time. `local-offset`
# reads the process's UTC offset, which `time` only allows while the process is
# single-threaded — hence the capture at the top of `main` (see workflows::gtime).
time = { version = "0.3", features = ["local-offset"] }
# tvision-rs is the TUI framework driving the edaptor browser (tree / leaf list / entry form).
# 0.16.0: X11/Wayland PRIMARY selection — middle-click pastes it into a field, and
# finishing a mouse selection publishes it (a masked field never publishes
# cleartext). Developed here and upstreamed, like 0.15.0's InputLine read-only mode
# and ValuePosition — see CLAUDE.md, "Upstream framework".

# tvision-rs's default `os-clipboard` feature pulls arboard -> wl-clipboard-rs ->
# wayland-backend, which cannot compile on illumos. Dropping it leaves the OSC 52
# rung of the clipboard chain — the one that actually works over ssh, which is how
# edaptor is driven on illumos. Every other platform keeps the native clipboard.
[target.'cfg(not(target_os = "illumos"))'.dependencies]
tvision-rs = "0.16.0"

[target.'cfg(target_os = "illumos")'.dependencies]
tvision-rs = { version = "0.16.0", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "edaptor"
path = "src/main.rs"

[[bin]]
name = "gen-testdata"
path = "src/bin/gen-testdata.rs"

[lib]
name = "edaptor"
path = "src/lib.rs"

# .deb and .rpm packages, built by .github/workflows/release-build-local.yml
# for the static musl targets and uploaded to the Gitea package registry.
[package.metadata.deb]
maintainer = "Tobias Oetiker <tobi@oetiker.ch>"
copyright = "2026, Tobias Oetiker <tobi@oetiker.ch>"
license-file = ["LICENSE", "0"]
extended-description = """\
A schema-driven terminal editor for OpenLDAP directories. It browses the \
directory in three panes and creates, edits, renames and deletes users, \
groups and their memberships, with forms derived from the server schema and \
from the entries already in the directory. A single static binary."""
section = "admin"
priority = "optional"
assets = [
    ["target/release/edaptor", "usr/bin/", "755"],
    ["man/edaptor.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/edaptor/README.md", "644"],
    ["LICENSE", "usr/share/doc/edaptor/LICENSE", "644"],
    ["examples/config.toml", "usr/share/doc/edaptor/examples/config.toml", "644"],
]

[package.metadata.generate-rpm]
summary = "Schema-driven terminal editor for OpenLDAP directories"
license = "MIT"
# The musl builds are statically linked, so there is nothing to depend on, and
# the host's find-requires cannot inspect a cross-built aarch64 binary anyway.
auto-req = "no"
assets = [
    { source = "target/release/edaptor", dest = "/usr/bin/edaptor", mode = "755" },
    { source = "man/edaptor.1", dest = "/usr/share/man/man1/edaptor.1", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/edaptor/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/edaptor/LICENSE", mode = "644", doc = true },
    { source = "examples/config.toml", dest = "/usr/share/doc/edaptor/examples/config.toml", mode = "644", doc = true },
]
