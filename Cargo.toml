[package]
name = "edaptor"
version = "0.4.0"
edition = "2021"
description = "TUI for editing OpenLDAP directories (users, groups, memberships)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
md4 = "0.11"             # NT hash (sambaNTPassword = MD4(UTF-16LE(password)))
# default-features = false is REQUIRED: drops rustls's default aws-lc-rs provider,
# leaving only ldap3's `ring`. Two providers would panic ClientConfig::builder().
rustls = { version = "0.23", default-features = false }  # custom ClientConfig for a configured CA
rustls-pemfile = "2"     # parse PEM CA certificates into CertificateDer
rpassword = "7"          # read the bind password without echo
ldap-types = { version = "0.7", default-features = false, features = ["chumsky"] }
chumsky = "0.12"
oid = "0.3"
# TUI stack (ratatui, no vendored forks). tui-prompts is the Unicode-correct
# edit-state engine; rendering is hand-styled so each pane owns its background.
ratatui = "0.30"
tui-tree-widget = "0.24"
tui-prompts = "0.6"
crossterm = "0.29"
unicode-width = "0.2"
# tvision-rs UI (migration target). During M1-M4 it ships only via the
# edaptor-tv dev binary; the default edaptor binary stays ratatui until M5.
tvision-rs = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "edaptor"
path = "src/main.rs"

[[bin]]
name = "gen-testdata"
path = "src/bin/gen-testdata.rs"

[[bin]]
name = "edaptor-tv"
path = "src/bin/edaptor-tv.rs"

[lib]
name = "edaptor"
path = "src/lib.rs"

# tvision-rs Splitter Tab-focus fix is not in a published release yet; pin to the
# upstream commit (oetiker/tvision-rs#feat/splitter-tab-focus). Drop this once a
# release (>=0.1.3) carrying it ships and bump the version above.
[patch.crates-io]
tvision-rs = { git = "https://github.com/oetiker/tvision-rs.git", rev = "8ba2b53e56ec7524f427b593a4fbb08b17bea72a" }
